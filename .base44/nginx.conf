# Sandbox-only nginx configuration for the Base44 preview.
#
# Why a full config instead of a conf.d snippet: the sandbox clones the repo
# root as 0700 root-owned, so the stock `user nginx;` makes every stat() on the
# bind-mounted source fail with permission denied. Running the workers as root
# keeps the bind mount readable, which is what lets edits show on reload.
user root;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        # The project's single page is splash.html, so it serves "/".
        index splash.html;

        # Never expose repo metadata over HTTP.
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /splash.html;
        }
    }
}
