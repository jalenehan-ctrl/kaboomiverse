# Base44 sandbox environment for this project.
#
# The repo is a static site (splash.html + two PNGs), so it is served straight
# from the cloned source by nginx: the repo is bind-mounted into the web root,
# which means editing a file is visible on the next page load with no rebuild.
#
# No external services, no credentials, no database.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    # The sandbox clones the repo root as 0700 root-owned, so the nginx worker
    # user cannot read the bind-mounted source unless workers run as root.
    user: "0:0"
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only and "localhost"
      # resolves to ::1 inside the container, giving a false connection refused.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
